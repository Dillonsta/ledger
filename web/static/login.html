<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记账本 · 登录</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="center-body">
<div class="login-card">
  <h1>记账本</h1>
  <p class="sub">轻量自托管 · ledger</p>
  <form id="loginForm">
    <div class="field"><label>用户名</label><input id="u" autocomplete="username" autofocus></div>
    <div class="field"><label>密码</label><input id="p" type="password" autocomplete="current-password"></div>
    <div id="err" class="err hidden"></div>
    <button class="btn primary block" type="submit">登 录</button>
  </form>
</div>
<script>
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.classList.add('hidden');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u.value.trim(), password: p.value })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '登录失败');
    localStorage.setItem('ledger_token', data.token);
    location.replace('/');
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
  }
};
</script>
</body>
</html>
